name: Build and upload resume

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9][0-1][0-9][0-3][0-9][0-2][0-9][0-5][0-9][0-5][0-9]"

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build resumes
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            resume-en.tex
            resume-ru.tex
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload English PDF
        id: upload-pdf-en
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: resume-en.pdf
          asset_name: resume-en.pdf
          asset_content_type: application/pdf
      - name: Upload Russian PDF
        id: upload-pdf-ru
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: resume-ru.pdf
          asset_name: resume-ru.pdf
          asset_content_type: application/pdf
